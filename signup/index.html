<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - Audiory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#FF6B00', dark: '#E05D00', bg: '#0B0C0E', card: '#14161A', border: '#22262E' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-bg text-gray-100 font-sans min-h-screen flex items-center justify-center p-4">

  <!-- INLINE STATUS TOAST -->
  <div id="alert-box" class="fixed top-4 right-4 z-50 hidden max-w-sm px-4 py-3 bg-brand-card border rounded-xl text-xs font-semibold text-white shadow-2xl flex items-center gap-2">
    <i data-lucide="info" class="w-4 h-4 text-brand"></i>
    <span id="toast-message"></span>
  </div>

  <div class="w-full max-w-md bg-brand-card border border-brand-border rounded-2xl p-8 shadow-2xl">
    
    <!-- BRANDING LOGO & HEADER -->
    <div class="text-center mb-8">
      <a href="/" class="inline-flex items-center gap-2 mb-4">
        <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center font-black text-black text-xl shadow-lg shadow-brand/20">A</div>
        <span class="font-black text-2xl tracking-wider text-white">AUDIORY<span class="text-brand">.</span></span>
      </a>
      <h1 class="text-xl font-black text-white">Join Audiory</h1>
      <p class="text-xs text-gray-400 mt-1">Create an account to stream, publish, and connect.</p>
    </div>

    <!-- REGISTRATION FORM -->
    <form id="signup-form" class="space-y-4">
      
      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Display Name</label>
        <div class="relative">
          <i data-lucide="user" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="text" id="inp-display-name" required placeholder="Artist or Listener Name" 
            class="w-full pl-10 pr-4 py-3 bg-brand-bg border border-brand-border rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:border-brand transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Username</label>
        <div class="relative">
          <i data-lucide="at-sign" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="text" id="inp-username" required placeholder="username" 
            class="w-full pl-10 pr-4 py-3 bg-brand-bg border border-brand-border rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:border-brand transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Email Address</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="email" id="inp-email" required placeholder="you@example.com" 
            class="w-full pl-10 pr-4 py-3 bg-brand-bg border border-brand-border rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:border-brand transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Password</label>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-gray-500"></i>
          <input type="password" id="inp-password" required placeholder="••••••••" minlength="6"
            class="w-full pl-10 pr-4 py-3 bg-brand-bg border border-brand-border rounded-xl text-white text-sm placeholder-gray-500 focus:outline-none focus:border-brand transition" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1.5">Account Type</label>
        <select id="inp-role" class="w-full px-4 py-3 bg-brand-bg border border-brand-border rounded-xl text-white text-sm focus:outline-none focus:border-brand transition">
          <option value="listener">Music Listener</option>
          <option value="creator">Creator / Artist Studio</option>
        </select>
      </div>

      <button type="submit" id="btn-submit"
        class="w-full py-3.5 bg-brand hover:bg-brand-dark text-black font-extrabold rounded-xl shadow-lg shadow-brand/20 transition flex items-center justify-center gap-2 text-sm mt-2">
        <span>Create Account</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- FOOTER NAV -->
    <div class="mt-6 pt-6 border-t border-brand-border text-center text-xs text-gray-400">
      Already have an account? 
      <a href="/login/" class="text-brand hover:underline font-bold">Sign in here</a>
    </div>

  </div>

  <script>
    const API_BASE = 'https://audiorydistribution.dandredurkofficial.workers.dev';
    
    lucide.createIcons();

    const signupForm = document.getElementById('signup-form');
    const alertBox = document.getElementById('alert-box');
    const toastMessage = document.getElementById('toast-message');
    const submitBtn = document.getElementById('btn-submit');

    function showAlert(message, isError = false) {
      toastMessage.innerText = message;
      alertBox.className = isError 
        ? "fixed top-4 right-4 z-50 max-w-sm px-4 py-3 bg-brand-card border border-red-500/50 rounded-xl text-xs font-semibold text-red-400 shadow-2xl flex items-center gap-2"
        : "fixed top-4 right-4 z-50 max-w-sm px-4 py-3 bg-brand-card border border-brand rounded-xl text-xs font-semibold text-brand shadow-2xl flex items-center gap-2";
      
      setTimeout(() => alertBox.classList.add('hidden'), 4000);
    }

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();

      const payload = {
        display_name: document.getElementById('inp-display-name').value.trim(),
        username: document.getElementById('inp-username').value.trim(),
        email: document.getElementById('inp-email').value.trim(),
        password: document.getElementById('inp-password').value,
        role: document.getElementById('inp-role').value
      };

      submitBtn.disabled = true;
      submitBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Creating Account...`;
      lucide.createIcons();

      try {
        const response = await fetch(`${API_BASE}/api/v1/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(result.error || result.message || "Registration failed.");
        }

        if (result.token) {
          localStorage.setItem('audiory_token', result.token);
        }

        showAlert("Account created! Redirecting...", false);

        setTimeout(() => {
          if (payload.role === 'creator') {
            window.location.href = '/creators/';
          } else {
            window.location.href = '/';
          }
        }, 1500);

      } catch (err) {
        showAlert(err.message, true);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>Create Account</span> <i data-lucide="arrow-right" class="w-4 h-4"></i>`;
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
